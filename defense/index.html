<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>솜솜시티: 당근빌라 방범대 (M0 프로토타입)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥕</text></svg>">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:#f3ede2; font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; }
  #app { width:min(420px,100vw); height:680px; position:relative; background:#fdfbf5; border-radius:12px; overflow:hidden; user-select:none; }
  canvas { position:absolute; left:0; top:80px; width:100%; height:520px; display:block; }
  button { border:2px solid #222; background:#fff; border-radius:10px; font-family:inherit; font-weight:700; color:#5a4a3a; box-shadow:2px 2px 0 #222; cursor:pointer; }
  button:active { transform:translate(2px,2px); box-shadow:none; }

  #hud { position:absolute; left:0; top:0; width:100%; height:80px; padding:10px 10px 0; display:flex; align-items:flex-start; gap:6px; z-index:5; }
  .pill { display:flex; align-items:center; gap:5px; font-size:12px; font-weight:800; color:#5a4a3a; background:#fdfbf5; border:2px solid #222; border-radius:20px; box-shadow:2px 2px 0 #222; padding:6px 12px; white-space:nowrap; }
  .pill img { width:16px; height:16px; object-fit:contain; }
  #lifePill { color:#d05a4a; }
  #speedBtn { margin-left:auto; width:44px; height:38px; font-size:12px; font-weight:800; background:#fff; padding:0; }
  #speedBtn.on { background:#f6eed8; }
  #waveInfo { position:absolute; left:10px; top:52px; font-size:11px; font-weight:700; color:#5a4a3a; background:rgba(253,251,245,.92); border:1.5px solid #e2d8c4; border-radius:20px; padding:3px 12px; z-index:5; }

  #dock { position:absolute; left:0; bottom:0; width:100%; height:80px; background:rgba(253,251,245,.96); border-top:2px solid #222; padding:7px 10px; display:flex; gap:8px; align-items:center; z-index:5; }
  .card { width:64px; height:64px; border:2px solid #222; border-radius:10px; background:#fff; box-shadow:2px 2px 0 #222; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; cursor:pointer; }
  .card.sel { border-color:#b06a2a; border-width:2.5px; background:#f6eed8; transform:translateY(-4px); }
  .card.poor { opacity:.5; }
  .card img { width:34px; height:34px; object-fit:contain; pointer-events:none; }
  .card .c { display:flex; align-items:center; gap:2px; font-size:10px; font-weight:800; color:#b08a3a; }
  .card .c img { width:11px; height:11px; }
  #dockMsg { flex:1; font-size:10.5px; font-weight:700; color:#9a8b7a; line-height:1.5; }
  #waveBtn { padding:10px 14px; font-size:13px; background:#f6eed8; }

  .screen { position:absolute; inset:0; background:rgba(253,251,245,.96); z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:24px; }
  .hidden { display:none !important; }
  .screen h1 { font-size:24px; color:#5a4a3a; line-height:1.35; }
  .screen .sub { font-size:13px; color:#9a8b7a; line-height:1.7; }
  .tagM0 { font-size:11px; font-weight:800; color:#b08a3a; background:#f3ede2; border:1.5px solid #e2d8c4; border-radius:20px; padding:3px 12px; }
  #startBtn { font-size:17px; padding:13px 40px; background:#f6eed8; }
  #stars { font-size:34px; letter-spacing:6px; color:#e0a92e; }

  #popup { position:absolute; left:24px; right:24px; bottom:92px; background:rgba(253,251,245,.97); border:2.5px solid #222; border-radius:14px; box-shadow:3px 3px 0 #222; padding:12px 14px; z-index:10; }
  #popup .row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  #popup .nm { font-weight:800; font-size:15px; color:#5a4a3a; }
  #popup .st { font-size:11.5px; color:#8a7a6a; line-height:1.5; flex:1; }
  #popup .btns { display:flex; gap:8px; }
  #popup button { flex:1; padding:9px 0; font-size:12.5px; }
  #upBtn { background:#f6eed8; }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="hud">
    <span class="pill" id="wavePill">WAVE -</span>
    <span class="pill"><img id="acornIco" alt="도토리">​<b id="acornN">200</b></span>
    <span class="pill" id="lifePill">❤ 10/10</span>
    <button id="speedBtn">1×</button>
  </div>
  <div id="waveInfo">방범대를 배치하고 웨이브를 시작하세요</div>

  <div id="dock">
    <div class="card" data-t="migae"><img id="cardMigae" alt="미개"><span class="c"><img class="ac" alt="">80</span></div>
    <div class="card" data-t="kkito"><img id="cardKkito" alt="끼토"><span class="c"><img class="ac" alt="">100</span></div>
    <div id="dockMsg">카드 선택 → 나무 블록 탭 배치<br>배치된 주민 탭 = 강화/회수</div>
    <button id="waveBtn">웨이브 시작</button>
  </div>

  <div id="popup" class="hidden">
    <div class="row"><span class="nm" id="pNm"></span><span class="st" id="pSt"></span></div>
    <div class="btns"><button id="upBtn"></button><button id="sellBtn"></button><button id="closeBtn">닫기</button></div>
  </div>

  <div id="title" class="screen">
    <span class="tagM0">M0 프로토타입 — 재미 검증용</span>
    <h1>🥕 솜솜시티<br>당근빌라 방범대</h1>
    <div class="sub">대나무숲 빌라에서 꼬릿 구름이 흘러온다!<br>미개와 끼토를 골목 블록에 배치해<br>당근 빌라의 쾌적도를 지키자 (4웨이브)</div>
    <button id="startBtn">골목 지키러 가기</button>
    <div class="sub" style="font-size:11px;">S1 '첫 골목' · 미개(속사) + 끼토(감속) · 무찌르지 않는다, 치운다</div>
  </div>

  <div id="result" class="screen hidden">
    <div id="stars"></div>
    <h1 id="resTitle"></h1>
    <div class="sub" id="resSub"></div>
    <button id="retryBtn" style="font-size:15px; padding:11px 34px; background:#f6eed8;">다시 하기</button>
  </div>
</div>

<script>
'use strict';
// ===== 기획서 v0.3 데이터 (선언형 — §9) =====
const TILE = 52, COLS = 8, ROWS = 10, OX = 2;
const S1 = {
  start: 200,
  map: ['...E....','..#=#...','...=..#.','...===..','....#=#.','...#.=..','..====..','.#=#....','..=.....','..V.....'],
  waves: [ [['k',4]], [['k',5],['d',2]], [['d',6]], [['k',8],['d',4]] ], // M0: 꼬릿+먼지
};
const TOWERS = {
  migae: { name:'미개', cost:80, w:34, h:36,
    lv:[{dmg:4,rate:.25,range:1.5},{dmg:6,rate:.22,range:1.5,up:64},{dmg:8,rate:.18,range:2,up:120}] },
  kkito: { name:'끼토', cost:100, w:46, h:60,
    lv:[{slow:.30,range:1.5},{slow:.40,range:2,up:80},{slow:.50,range:2.5,up:150}] },
};
const ENEMIES = { k:{name:'꼬릿 구름',hp:20,spd:.8,reward:5,size:44}, d:{name:'먼지 뭉치',hp:10,spd:1.6,reward:4,size:28} };
const PREP_TIME = 12, SKIP_BONUS = 10, WAVE_BONUS = 20, REFUND = .7;

// ===== 맵 파싱: 경로 웨이포인트 + 블록 =====
const cellAt=(c,r)=> (r>=1&&r<=ROWS&&c>=1&&c<=COLS) ? S1.map[r-1][c-1] : '.';
const center=(c,r)=>({ x:OX+(c-1)*TILE+TILE/2, y:(r-1)*TILE+TILE/2 });
let waypoints=[], blocks=[], entry=null, villa=null;
(function parse(){
  for(let r=1;r<=ROWS;r++) for(let c=1;c<=COLS;c++){
    const ch=cellAt(c,r);
    if(ch==='E') entry={c,r}; else if(ch==='V') villa={c,r};
    else if(ch==='#') blocks.push({c,r,tower:null});
  }
  let cur=entry, prev=null; waypoints.push(center(cur.c,cur.r));
  while(!(cur.c===villa.c&&cur.r===villa.r)){
    const nb=[[0,1],[0,-1],[1,0],[-1,0]].map(([dc,dr])=>({c:cur.c+dc,r:cur.r+dr}))
      .find(n=>!(prev&&n.c===prev.c&&n.r===prev.r)&&'=V'.includes(cellAt(n.c,n.r)));
    prev=cur; cur=nb; waypoints.push(center(cur.c,cur.r));
  }
})();

// ===== 에셋 (흰배경 플러드필 키잉 — 프로덕션 가이드 방식) =====
function keyImage(img){
  const c=document.createElement('canvas'); c.width=img.width; c.height=img.height;
  const x=c.getContext('2d'); x.drawImage(img,0,0);
  const d=x.getImageData(0,0,c.width,c.height), p=d.data, W=c.width, H=c.height;
  const white=i=>p[i]>235&&p[i+1]>235&&p[i+2]>235&&p[i+3]>0;
  const q=[], seen=new Uint8Array(W*H);
  for(let i=0;i<W;i++){ q.push(i,(H-1)*W+i); } for(let j=0;j<H;j++){ q.push(j*W,j*W+W-1); }
  while(q.length){ const n=q.pop(); if(seen[n])continue; seen[n]=1;
    if(!white(n*4))continue; p[n*4+3]=0;
    const cx=n%W, cy=(n/W)|0;
    if(cx>0)q.push(n-1); if(cx<W-1)q.push(n+1); if(cy>0)q.push(n-W); if(cy<H-1)q.push(n+W); }
  x.putImageData(d,0,0); return c;
}
const IMGS={};
function load(name,src){ return new Promise(res=>{ const i=new Image(); i.onload=()=>{IMGS[name]=keyImage(i);res();}; i.onerror=res; i.src=src; }); }
const ready = Promise.all([ load('migae','../assets/sd_migae.png'), load('kkito','../assets/sd_kkito.png'), load('acorn','../assets/prop_acorn.png') ]);

// ===== 캔버스 =====
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=420, H=520, DPR=Math.min(3,window.devicePixelRatio||1);
cv.width=W*DPR; cv.height=H*DPR; ctx.scale(DPR,DPR);

// ===== 상태 =====
let state='TITLE', acorns=S1.start, life=10, waveIdx=-1, prepT=0, speed=1;
let enemies=[], spawnQ=[], fx=[], selCard=null, selTower=null, shakeT=0, time=0;

const $=id=>document.getElementById(id);
const ui={ wave:$('wavePill'), acorn:$('acornN'), life:$('lifePill'), info:$('waveInfo'),
  waveBtn:$('waveBtn'), popup:$('popup'), speed:$('speedBtn'), dockMsg:$('dockMsg') };

function updHud(){
  ui.wave.textContent = waveIdx<0 ? 'WAVE -/4' : `WAVE ${Math.min(waveIdx+1,4)}/4`;
  ui.acorn.textContent = acorns;
  ui.life.textContent = `❤ ${life}/10`;
  document.querySelectorAll('.card').forEach(el=>{
    el.classList.toggle('poor', acorns < TOWERS[el.dataset.t].cost);
    el.classList.toggle('sel', selCard===el.dataset.t);
  });
}

// ===== 웨이브 =====
function startWave(){
  waveIdx++; state='WAVE'; ui.waveBtn.classList.add('hidden'); ui.info.textContent=`웨이브 ${waveIdx+1} — 골목을 지켜라!`;
  spawnQ=[]; let t=0.4;
  for(const [type,n] of S1.waves[waveIdx]) for(let i=0;i<n;i++){ spawnQ.push({type,t}); t+= type==='d'?0.75:1.05; }
  updHud();
}
function endWave(){
  acorns+=WAVE_BONUS; addFx('text',W/2,60,`웨이브 클리어! +${WAVE_BONUS}`);
  if(waveIdx>=S1.waves.length-1) return finish(true);
  state='PREP'; prepT=PREP_TIME;
  ui.waveBtn.textContent=`바로 시작 (+${SKIP_BONUS})`; ui.waveBtn.classList.remove('hidden');
  updHud();
}
function finish(win){
  state='RESULT';
  const stars = win ? (life>=10?3:life>=6?2:1) : 0;
  $('stars').textContent = win ? '★★★'.slice(0,stars)+'☆☆☆'.slice(0,3-stars) : '…';
  $('resTitle').textContent = win ? (stars===3?'완벽한 방범이었어요!':'당근 빌라를 지켰다!') : '골목이 꼬릿꼬릿해졌다…';
  $('resSub').innerHTML = win
    ? `남은 쾌적도 ${life}/10 → ${stars}★<br>단추 보상·강화는 M1에서 이어집니다`
    : '배치 위치를 바꿔서 다시 도전해보세요<br>(입구 근처 감속 + 긴 직선에 속사 추천)';
  $('result').classList.remove('hidden');
}

// ===== 배치/강화 =====
function tileFromXY(x,y){ return { c: Math.floor((x-OX)/TILE)+1, r: Math.floor(y/TILE)+1 }; }
function blockAt(c,r){ return blocks.find(b=>b.c===c&&b.r===r); }
function place(b,type){
  const T=TOWERS[type]; if(acorns<T.cost) return;
  acorns-=T.cost; b.tower={type,lv:0,cool:0,spent:T.cost}; selCard=null; updHud();
  addFx('pop',center(b.c,b.r).x,center(b.c,b.r).y);
}
function showPopup(b){
  selTower=b; const t=b.tower, T=TOWERS[t.type], cur=T.lv[t.lv], nxt=T.lv[t.lv+1];
  $('pNm').textContent=`${T.name} Lv.${t.lv+1}`;
  $('pSt').textContent = t.type==='migae'
    ? `공격 ${cur.dmg} · ${cur.rate}s · ${cur.range}타일` : `감속 -${cur.slow*100}% · ${cur.range}타일`;
  $('upBtn').textContent = nxt ? `강화 🌰${nxt.up}` : '최대 레벨';
  $('upBtn').disabled=!nxt||acorns<(nxt?nxt.up:0);
  $('sellBtn').textContent = `회수 +${Math.floor(t.spent*REFUND)}`;
  ui.popup.classList.remove('hidden');
}
function hidePopup(){ selTower=null; ui.popup.classList.add('hidden'); }
$('upBtn').onclick=()=>{ const t=selTower.tower, nxt=TOWERS[t.type].lv[t.lv+1];
  if(nxt&&acorns>=nxt.up){ acorns-=nxt.up; t.spent+=nxt.up; t.lv++; updHud(); showPopup(selTower); addFx('pop',center(selTower.c,selTower.r).x,center(selTower.c,selTower.r).y); } };
$('sellBtn').onclick=()=>{ acorns+=Math.floor(selTower.tower.spent*REFUND); selTower.tower=null; hidePopup(); updHud(); };
$('closeBtn').onclick=hidePopup;

cv.addEventListener('pointerdown',e=>{
  if(state==='TITLE'||state==='RESULT')return;
  const rect=cv.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width), y=(e.clientY-rect.top)*(H/rect.height);
  const {c,r}=tileFromXY(x,y), b=blockAt(c,r);
  hidePopup();
  if(b&&b.tower){ showPopup(b); return; }
  if(b&&!b.tower&&selCard){ place(b,selCard); return; }
});
document.querySelectorAll('.card').forEach(el=>el.addEventListener('pointerdown',e=>{
  e.preventDefault(); const t=el.dataset.t; hidePopup();
  selCard = selCard===t ? null : t; updHud();
}));
ui.waveBtn.onclick=()=>{ if(state==='PREP'&&waveIdx>=0){ acorns+=SKIP_BONUS; } startWave(); };
ui.speed.onclick=()=>{ speed=speed===1?2:1; ui.speed.textContent=speed+'×'; ui.speed.classList.toggle('on',speed===2); };
$('startBtn').onclick=()=>{ $('title').classList.add('hidden'); state='PREP'; waveIdx=-1; ui.waveBtn.textContent='웨이브 시작'; updHud(); };
$('retryBtn').onclick=()=>{ location.reload(); };

// ===== 게임 로직 =====
function spawn(type){
  const E=ENEMIES[type];
  enemies.push({ type, hp:E.hp, max:E.hp, wp:0, x:waypoints[0].x, y:waypoints[0].y-40, prog:0, wob:Math.random()*7 });
}
function slowFactorAt(x,y){
  let f=1;
  for(const b of blocks){ const t=b.tower; if(!t||t.type!=='kkito')continue;
    const L=TOWERS.kkito.lv[t.lv], p=center(b.c,b.r);
    if((x-p.x)**2+(y-p.y)**2 <= (L.range*TILE)**2) f=Math.min(f,1-L.slow); }
  return f;
}
function update(dt){
  time+=dt;
  if(state==='PREP'&&waveIdx>=0){ prepT-=dt; ui.info.textContent=`다음 웨이브까지 ${Math.ceil(prepT)}초 — 재정비!`; if(prepT<=0) startWave(); }
  if(state!=='WAVE'&&state!=='PREP')return;
  // 스폰
  for(const s of spawnQ) if(!s.done&&(s.t-=dt)<=0){ s.done=true; spawn(s.type); }
  spawnQ=spawnQ.filter(s=>!s.done);
  // 이동
  for(const en of enemies){
    const E=ENEMIES[en.type], tgt=waypoints[en.wp+1];
    if(!tgt){ en.dead=true; life--; shakeT=.3; addFx('bad',en.x,en.y); updHud(); if(life<=0)finish(false); continue; }
    const sp=E.spd*TILE*slowFactorAt(en.x,en.y)*dt;
    const dx=tgt.x-en.x, dy=tgt.y-en.y, d=Math.hypot(dx,dy);
    if(d<=sp){ en.x=tgt.x; en.y=tgt.y; en.wp++; } else { en.x+=dx/d*sp; en.y+=dy/d*sp; }
    en.prog=en.wp+1-d/TILE;
  }
  // 미개 공격 (진행도 최대 대상)
  for(const b of blocks){ const t=b.tower; if(!t||t.type!=='migae')continue;
    t.cool-=dt; if(t.cool>0)continue;
    const L=TOWERS.migae.lv[t.lv], p=center(b.c,b.r), R2=(L.range*TILE)**2;
    let best=null;
    for(const en of enemies) if(!en.dead&&(en.x-p.x)**2+(en.y-p.y)**2<=R2&&(!best||en.prog>best.prog)) best=en;
    if(best){ t.cool=L.rate; best.hp-=L.dmg; addFx('shot',p.x,p.y-20,null,best);
      if(best.hp<=0&&!best.dead){ best.dead=true; acorns+=ENEMIES[best.type].reward;
        addFx('puff',best.x,best.y); addFx('text',best.x,best.y-24,'+'+ENEMIES[best.type].reward); updHud(); } }
  }
  enemies=enemies.filter(e=>!e.dead);
  if(state==='WAVE'&&!spawnQ.length&&!enemies.length) endWave();
  fx=fx.filter(f=>(f.t-=dt)>0);
  if(shakeT>0)shakeT-=dt;
}
function addFx(kind,x,y,txt,tgt){ fx.push({kind,x,y,txt,tgt,t: kind==='shot'?.08 : kind==='text'?.9 : .45, max: kind==='text'?.9:.45}); }

// ===== 렌더 =====
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(shakeT>0) ctx.translate((Math.random()-.5)*6,(Math.random()-.5)*6);
  ctx.clearRect(-10,-10,W+20,H+20);
  ctx.fillStyle='#f3ede2'; ctx.fillRect(0,0,W,H);
  // 그리드
  ctx.strokeStyle='rgba(90,74,58,.08)'; ctx.lineWidth=1;
  for(let c=0;c<=COLS;c++){ ctx.beginPath(); ctx.moveTo(OX+c*TILE,0); ctx.lineTo(OX+c*TILE,H); ctx.stroke(); }
  for(let r=0;r<=ROWS;r++){ ctx.beginPath(); ctx.moveTo(0,r*TILE); ctx.lineTo(W,r*TILE); ctx.stroke(); }
  // 타일
  for(let r=1;r<=ROWS;r++)for(let c=1;c<=COLS;c++){
    const ch=cellAt(c,r), x=OX+(c-1)*TILE, y=(r-1)*TILE;
    if(ch==='='){ ctx.fillStyle='#e6d8ba'; ctx.fillRect(x,y,TILE,TILE); ctx.strokeStyle='#d4c29a'; ctx.strokeRect(x+.5,y+.5,TILE-1,TILE-1); }
    if(ch==='E'){ ctx.fillStyle='rgba(58,74,42,.6)'; ctx.fillRect(x,y,TILE,TILE); ctx.strokeStyle='#222'; ctx.lineWidth=2; ctx.strokeRect(x+1,y+1,TILE-2,TILE-2); ctx.lineWidth=1;
      ctx.fillStyle='#fdfbf5'; ctx.font='800 9px sans-serif'; ctx.textAlign='center'; ctx.fillText('대나무숲',x+TILE/2,y+22); ctx.fillText('▼',x+TILE/2,y+36); }
    if(ch==='V'){ ctx.fillStyle='#f6d9b8'; ctx.fillRect(x,y,TILE,TILE); ctx.strokeStyle='#222'; ctx.lineWidth=2; ctx.strokeRect(x+1,y+1,TILE-2,TILE-2); ctx.lineWidth=1;
      ctx.font='22px sans-serif'; ctx.textAlign='center'; ctx.fillText('🥕',x+TILE/2,y+26);
      ctx.fillStyle='#5a4a3a'; ctx.font='800 8px sans-serif'; ctx.fillText('당근빌라',x+TILE/2,y+42); }
  }
  // 설치 블록
  for(const b of blocks){
    const x=OX+(b.c-1)*TILE+4, y=(b.r-1)*TILE+4, s=TILE-8;
    ctx.fillStyle = (!b.tower&&selCard) ? '#cfe3c0' : '#d9b98a';
    ctx.strokeStyle = (!b.tower&&selCard) ? '#4a7a3a' : '#222';
    ctx.lineWidth=2; ctx.setLineDash((!b.tower&&selCard)?[5,4]:[]);
    ctx.beginPath(); ctx.roundRect(x,y,s,s,6); ctx.fill(); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth=1;
  }
  // 사거리 링 (선택 타워)
  if(selTower&&selTower.tower){ const t=selTower.tower, L=TOWERS[t.type].lv[t.lv], p=center(selTower.c,selTower.r);
    ctx.beginPath(); ctx.arc(p.x,p.y,L.range*TILE,0,7);
    ctx.fillStyle = t.type==='kkito'?'rgba(106,120,200,.14)':'rgba(210,114,42,.12)'; ctx.fill();
    ctx.strokeStyle = t.type==='kkito'?'rgba(106,120,200,.6)':'rgba(210,114,42,.6)'; ctx.setLineDash([5,5]); ctx.stroke(); ctx.setLineDash([]); }
  // 끼토 슬로우 오라 (상시 옅게)
  for(const b of blocks){ const t=b.tower; if(!t||t.type!=='kkito')continue;
    const L=TOWERS.kkito.lv[t.lv], p=center(b.c,b.r);
    ctx.beginPath(); ctx.arc(p.x,p.y,L.range*TILE,0,7); ctx.fillStyle='rgba(106,120,200,.07)'; ctx.fill(); }
  // 타워
  for(const b of blocks){ const t=b.tower; if(!t)continue;
    const T=TOWERS[t.type], p=center(b.c,b.r), img=IMGS[t.type];
    const bob=Math.sin(time*3+b.c)*1.5;
    if(img) ctx.drawImage(img, p.x-T.w/2, (b.r)*TILE-4-T.h+bob, T.w, T.h);
    for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(p.x-12+i*12,(b.r)*TILE-2,3,0,7);
      ctx.fillStyle=i<=t.lv?'#e0a92e':'#fff'; ctx.fill(); ctx.strokeStyle='#222'; ctx.stroke(); }
  }
  // 골칫거리
  for(const en of enemies){
    const E=ENEMIES[en.type], wob=Math.sin(time*4+en.wob)*2;
    ctx.save(); ctx.translate(en.x,en.y+wob);
    if(en.type==='k'){ // 꼬릿 구름
      ctx.fillStyle='#b9aec9'; ctx.strokeStyle='#222'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(-10,2,12,0,7); ctx.arc(0,-6,14,0,7); ctx.arc(11,3,11,0,7); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(-4,-4,1.8,0,7); ctx.arc(5,-4,1.8,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(0,2,3,0,Math.PI); ctx.strokeStyle='#222'; ctx.lineWidth=1.5; ctx.stroke(); // 곤란한 입
      ctx.strokeStyle='#8a7fa0'; ctx.beginPath(); ctx.moveTo(-2,-20); ctx.quadraticCurveTo(2,-24,-1,-28); ctx.stroke(); // 냄새선
    } else { // 먼지
      ctx.fillStyle='#c9b9a0'; ctx.strokeStyle='#222'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,0,E.size/2,0,7); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(-4,-2,1.5,0,7); ctx.arc(4,-2,1.5,0,7); ctx.fill();
    }
    // HP바
    ctx.fillStyle='#fdfbf5'; ctx.strokeStyle='#222'; ctx.lineWidth=1;
    ctx.fillRect(-13,-E.size/2-12,26,5); ctx.strokeRect(-13,-E.size/2-12,26,5);
    ctx.fillStyle='#d05a4a'; ctx.fillRect(-12,-E.size/2-11,24*(en.hp/en.max),3);
    ctx.restore();
  }
  // 이펙트
  for(const f of fx){ const a=f.t/f.max;
    if(f.kind==='shot'&&f.tgt){ ctx.strokeStyle='rgba(224,169,46,.9)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(f.x,f.y); ctx.lineTo(f.tgt.x,f.tgt.y); ctx.stroke(); }
    if(f.kind==='puff'){ ctx.globalAlpha=a; for(let i=0;i<5;i++){ const ang=i/5*6.28+f.t*3;
      ctx.beginPath(); ctx.arc(f.x+Math.cos(ang)*(1-a)*26, f.y+Math.sin(ang)*(1-a)*26, 4*a,0,7);
      ctx.fillStyle=['#f2c14b','#a8d8b9','#b9aec9'][i%3]; ctx.fill(); } ctx.globalAlpha=1; }
    if(f.kind==='pop'){ ctx.globalAlpha=a; ctx.beginPath(); ctx.arc(f.x,f.y,(1-a)*24,0,7);
      ctx.strokeStyle='#e0a92e'; ctx.lineWidth=3; ctx.stroke(); ctx.globalAlpha=1; }
    if(f.kind==='bad'){ ctx.globalAlpha=a*.5; ctx.fillStyle='#d05a4a'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
    if(f.kind==='text'){ ctx.globalAlpha=a; ctx.fillStyle='#b08a3a'; ctx.font='800 13px sans-serif';
      ctx.textAlign='center'; ctx.fillText(f.txt,f.x,f.y-(1-a)*18); ctx.globalAlpha=1; }
  }
}

// ===== 루프 =====
let last=0;
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000)*speed; last=ts;
  update(dt); draw(); requestAnimationFrame(loop);
}
ready.then(()=>{
  const put=(id,name)=>{ const el=$(id); if(IMGS[name]) el.src=IMGS[name].toDataURL(); };
  put('cardMigae','migae'); put('cardKkito','kkito'); put('acornIco','acorn');
  document.querySelectorAll('.ac').forEach(el=>{ if(IMGS.acorn) el.src=IMGS.acorn.toDataURL(); });
  updHud(); requestAnimationFrame(ts=>{ last=ts; requestAnimationFrame(loop); });
});
</script>
</body>
</html>
