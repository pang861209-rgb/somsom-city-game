};
const SKILLS={
 migae:{cd:18,dur:5,ico:'⚡',label:'뽈뽈 폭식'},
 kkito:{cd:20,dur:3,ico:'🐰',label:'전장 슬로우'},
 boneul:{cd:25,dur:5,ico:'🛡️',label:'낮잠 회복'},
 lachilchin:{cd:30,dur:5,ico:'🧺',label:'줍기 크루'},
 ramda:{cd:30,dur:0,ico:'🌰',label:'줍줍 +150'},
 bookgeo:{cd:30,dur:0,ico:'🌊',label:"'바다' 향"},
};

// ============ 저장 ============
const LS='somsom_defense_v1';
const save=()=>localStorage.setItem(LS,JSON.stringify(SAVE));
let SAVE={stars:{}}; try{ SAVE=JSON.parse(localStorage.getItem(LS))||SAVE; }catch(e){}

// ============ 사운드 (WebAudio 합성 — 게임1 방식) · 햅틱 ============
const AU={ctx:null,mute:!!SAVE.mute,last:0};
function ac(){ if(!AU.ctx){ try{ AU.ctx=new (window.AudioContext||window.webkitAudioContext)(); bgmStart(); }catch(e){} } return AU.ctx; }
function tone(f0,f1,dur,type,vol,when){ const c=ac(); if(!c||AU.mute)return;
  const t=c.currentTime+(when||0), o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f0,t);
  if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  g.gain.setValueAtTime(vol||.15,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.03); }
function buzz(ms){ try{ if(navigator.vibrate)navigator.vibrate(ms); }catch(e){} }
const SFX={
 place(){ tone(300,190,.12,'triangle',.2); buzz(10); },
 up(){ tone(500,900,.15,'triangle',.18); buzz(10); },
 sell(){ tone(400,250,.12,'triangle',.14); },
 shoot(){ const n=performance.now(); if(n-AU.last<90)return; AU.last=n; tone(900,700,.045,'square',.045); },
 mist(){ tone(320,180,.22,'sine',.08); },
 pop(){ tone(500,980,.09,'sine',.17); buzz(8); },
 coin(){ tone(880,0,.07,'sine',.11); tone(1320,0,.1,'sine',.11,.07); },
 bell(){ tone(1568,0,.22,'sine',.1); tone(2093,0,.3,'sine',.07,.08); buzz(8); },
 leak(){ tone(220,90,.35,'sawtooth',.2); buzz(40); },
 wave(){ tone(600,1150,.18,'sine',.14); },
 clear(){ [523,659,784].forEach((f,i)=>tone(f,0,.14,'triangle',.15,i*.09)); buzz(20); },
 skill(){ tone(400,1200,.25,'sine',.13); buzz(15); },
 boss(){ tone(70,55,.9,'sine',.3); tone(140,110,.9,'sine',.12); buzz(60); },
 win(){ [523,659,784,1047].forEach((f,i)=>tone(f,0,.2,'triangle',.16,i*.12)); },
 lose(){ tone(300,150,.5,'sawtooth',.11); tone(200,100,.6,'sawtooth',.09,.2); },
 deny(){ tone(200,160,.1,'square',.12); buzz(15); },
 star(){ tone(1047,0,.12,'triangle',.15); },
};
let bgmTimer=null; // 잔잔한 가을 아르페지오 루프
function bgmStart(){ if(bgmTimer)return;
  const seq=[392,494,587,494,440,523,659,523,349,440,523,440,392,494,587,740]; let i=0;
  bgmTimer=setInterval(()=>{ if(AU.mute||!AU.ctx||state==='TITLE'||document.hidden)return;
    tone(seq[i%16]/2,0,.5,'triangle',.04); if(i%2===0)tone(seq[(i+2)%16],0,.3,'sine',.026); i++; },420); }

// ============ 캐릭터 대사 (게임1 톤) ============
const LINES={
 migae:{place:'뽈뽈뽈—!',win:'뽈뽈!! (더듬이가 하트가 됐다)',lose:'뽈... (더듬이가 꼬불꼬불해졌다)'},
 kkito:{place:'가스 불은 잠갔고... 골목은 내가 지켜!',win:'해, 해냈어! 다들 무사하지?',lose:'으아아! 귀 잡고 멘붕...'},
 boneul:{place:'여기 눕는 게 제일 편하겠네~',win:'뭐, 별거 아니었네. 피자 시킬까?',lose:'죽기밖에 더 하겠냐~ 다시 하자.'},
 lachilchin:{place:'아이구 그래~ 은행은 맡겨두렴.',win:'늙은이가 또 해냈네 그래~',lose:'아이구야, 오늘은 이만 줍자.'},
 ramda:{place:'떨어지는 도토리 전부 내 거야!',win:'이 골목, 완전 희귀템이야!',lose:'방금 그 도토리 아까운데...'},
 bookgeo:{place:'서두르지 않아도, 지킬 수 있어요.',win:'천천히 왔는데, 어느새 이겼네요.',lose:'천천히... 다시 해봅시다.'},
};
function banner(txt,boss){ const s=$('bannerTxt'); s.className=''; void s.offsetWidth;
  s.textContent=txt; s.className='show'+(boss?' boss':''); }
function confetti(n){ const app=$('app');

    d.style.left=(4+Math.random()*92)+'%';

    app.appendChild(d); setTimeout(()=>d.remove(),3800); } }

// ============ 에셋 (플레이스홀더: 기존 SD — 시트 도착 시 이 매니페스트만 교체) ============
const MANIFEST={
 migae:'sd_migae', migae_win:'sd_migae_win', migae_hit:'sd_migae_hit',
 kkito:'sd_kkito', kkito_win:'sd_kkito_win', kkito_hit:'sd_kkito_hit',
 boneul:'sd_boneul', boneul_win:'sd_boneul_win', boneul_hit:'sd_boneul_hit',
 lachilchin:'sd_lachilchin', lachilchin_win:'sd_lachilchin_win', lachilchin_hit:'sd_lachilchin_hit',
 ramda:'sd_ramda', ramda_win:'sd_ramda_win', ramda_hit:'sd_ramda_hit',
 bookgeo:'sd_bookgeo', bookgeo_win:'sd_bookgeo_win', bookgeo_hit:'sd_bookgeo_hit',
 acorn:'prop_acorn', ginkgo:'prop_ginkgo', bg:'bg_alley',
};
const RAW=new Set(['bg']); // 키잉 없이 원본 사용
function keyImage(img){
  const s=Math.min(1,384/img.width);
  const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
  const x=c.getContext('2d'); x.drawImage(img,0,0,c.width,c.height);
  const d=x.getImageData(0,0,c.width,c.height), p=d.data, W=c.width, H=c.height;
  const white=i=>p[i]>235&&p[i+1]>235&&p[i+2]>235&&p[i+3]>0;
  const q=[], seen=new Uint8Array(W*H);
  for(let i=0;i<W;i++){ q.push(i,(H-1)*W+i); } for(let j=0;j<H;j++){ q.push(j*W,j*W+W-1); }
  while(q.length){ const n=q.pop(); if(seen[n])continue; seen[n]=1;
    if(!white(n*4))continue; p[n*4+3]=0;
    const cx=n%W, cy=(n/W)|0;
    if(cx>0)q.push(n-1); if(cx<W-1)q.push(n+1); if(cy>0)q.push(n-W); if(cy<H-1)q.push(n+W); }
  x.putImageData(d,0,0); return c;
}
function trimCanvas(c){
  const x=c.getContext('2d'), d=x.getImageData(0,0,c.width,c.height).data;
  let minX=c.width,minY=c.height,maxX=0,maxY=0;
  for(let y=0;y<c.height;y+=2)for(let xx=0;xx<c.width;xx+=2)
    if(d[(y*c.width+xx)*4+3]>10){ if(xx<minX)minX=xx; if(xx>maxX)maxX=xx; if(y<minY)minY=y; if(y>maxY)maxY=y; }
  if(maxX<=minX) return c;
  const o=document.createElement('canvas'); o.width=maxX-minX+2; o.height=maxY-minY+2;
  o.getContext('2d').drawImage(c,minX,minY,o.width,o.height,0,0,o.width,o.height); return o;
}

const cellAt=(c,r)=>(r>=1&&r<=ROWS&&c>=1&&c<=COLS)?SG.map[r-1][c-1]:'.';
const center=(c,r)=>({x:OX+(c-1)*TILE+TILE/2,y:(r-1)*TILE+TILE/2});

function loadStage(i){
  stageIdx=i; SG=STAGES[i];
  waypoints=[];blocks=[];barrs=[];tSpots=[];entry=null;villa=null;
  for(let r=1;r<=ROWS;r++)for(let c=1;c<=COLS;c++){
    const ch=cellAt(c,r);
    if(ch==='E')entry={c,r}; else if(ch==='V')villa={c,r};
    else if(ch==='#'||ch==='b')blocks.push({c,r,tower:null,small:ch==='b'});
    else if(ch==='T')tSpots.push({c,r});
  }
  let cur=entry,prev=null; waypoints.push(center(cur.c,cur.r));
  while(!(cur.c===villa.c&&cur.r===villa.r)){
    const nb=[[0,1],[0,-1],[1,0],[-1,0]].map(([dc,dr])=>({c:cur.c+dc,r:cur.r+dr}))
      .find(n=>!(prev&&n.c===prev.c&&n.r===prev.r)&&'=V'.includes(cellAt(n.c,n.r)));
    prev=cur; cur=nb; waypoints.push(center(cur.c,cur.r));
  }
  // T타일 → 가장 가까운 웨이포인트
  for(const t of tSpots){ const p=center(t.c,t.r); let bi=0,bd=1e9;
    waypoints.forEach((w,i)=>{ const d=(w.x-p.x)**2+(w.y-p.y)**2; if(d<bd){bd=d;bi=i;} }); t.wp=bi; }
  acorns=SG.start; life=10; waveIdx=-1; enemies=[];spawnQ=[];fx=[];
  selCard=null;selTower=null; gSlowT=hasteT=owwT=stunT=shieldT=crewT=0; tTimer=8; skCool={};
  buildDock(); buildSkills();
  state='PREP'; $('select').classList.add('hidden'); $('result').classList.add('hidden');
  ui.waveBtn.textContent='웨이브 시작'; ui.waveBtn.classList.remove('hidden');
  ui.info.textContent=`${SG.name} — 방범대를 배치하세요`;
  hidePopup(); updHud();
}

function tileFromXY(x,y){ return {c:Math.floor((x-OX)/TILE)+1, r:Math.floor(y/TILE)+1}; }
function slotAt(c,r){ return blocks.find(b=>b.c===c&&b.r===r)||barrs.find(b=>b.c===c&&b.r===r); }
function canPlace(type,c,r){
  const T=TOWERS[type];
  if(T.slot==='='){ return cellAt(c,r)==='='&&!barrs.find(b=>b.c===c&&b.r===r); }
  const b=blocks.find(b=>b.c===c&&b.r===r);
  if(!b||b.tower)return false;
  return b.small?T.slot.includes('b'):true;
}
function place(type,c,r){
  const T=TOWERS[type]; if(acorns<T.cost)return;
  acorns-=T.cost;
  const tw={type,lv:0,cool:0,kick:0,winT:0,prodT:0,spent:T.cost};
  if(T.slot==='='){ tw.hp=T.lv[0].hp; barrs.push({c,r,tower:tw}); }
  else blocks.find(b=>b.c===c&&b.r===r).tower=tw;
  selCard=null; updHud(); updSkills(); addFx('pop',center(c,r).x,center(c,r).y);
  SFX.place(); addFx('bubble',center(c,r).x,center(c,r).y-T.h-18,LINES[type].place);
}
function towerStat(b){
  const t=b.tower,T=TOWERS[t.type],L=T.lv[t.lv];
  if(t.type==='migae')return `공격 ${L.dmg} · ${L.rate}s · ${L.range}타일`;
  if(t.type==='kkito')return `감속 -${L.slow*100}% · 마킹 +${L.mark*100}% · ${L.range}타일`;
  if(t.type==='boneul')return `HP ${Math.ceil(t.hp)}/${L.hp} · 반격 ${L.thorn}/s`;
  if(t.type==='lachilchin')return `은행 회수 ${L.rate}s · +${L.gain}도토리 · ${L.range}타일`;
  if(t.type==='ramda')return `${L.every}초당 +${L.prod} · 보상 +${L.bonus*100}%`;
  if(t.type==='bookgeo')return `광역 ${L.dmg} · ${L.rate}s · ${L.range}타일`+(L.buff?` · 인접 공속 +${L.buff*100}%`:'');
}

// ============ 게임 로직 ============
function spawn(type,wp=0){
  const E=ENEMIES[type];
  enemies.push({type,hp:E.hp,max:E.hp,wp,x:waypoints[wp].x,y:waypoints[wp].y-(wp?0:40),prog:wp,wob:Math.random()*7,
    sumT:6,rev:0,revd:false});
  if(type==='boss'){ banner('왕꼬릿 구름 등장!!',true); SFX.boss(); shakeT=.5;
    placedOf('kkito').forEach(b=>addFx('bubble',center(b.c,b.r).x,center(b.c,b.r).y-90,'귀, 귀가 쭈뼛해!!')); }
}
function auraAt(x,y){
  let slow=1,mark=0;
  for(const b of blocks){ const t=b.tower; if(!t||t.type!=='kkito')continue;
    const L=TOWERS.kkito.lv[t.lv],p=center(b.c,b.r);
    if((x-p.x)**2+(y-p.y)**2<=(L.range*TILE)**2){ slow=Math.min(slow,1-L.slow); mark=Math.max(mark,L.mark); } }
  if(gSlowT>0)slow=Math.min(slow,.4);
  if(stunT>0)slow=0;
  return {slow,mark};
}
function rewardOf(en){
  let r=ENEMIES[en.type].reward;
  for(const b of blocks){ const t=b.tower; if(!t||t.type!=='ramda')continue;
    const L=TOWERS.ramda.lv[t.lv],p=center(b.c,b.r);
    if((en.x-p.x)**2+(en.y-p.y)**2<=(L.range*TILE)**2){ r=Math.round(r*(1+L.bonus)); break; } }
  return r;
}
function defeat(en,collector){
  en.dead=true; const r=collector==='lachilchin'?0:rewardOf(en);
  if(r){ acorns+=r; addFx('text',en.x,en.y-26,'+'+r); SFX.coin(); }
  addFx('puff',en.x,en.y); SFX.pop(); hitstopT=Math.max(hitstopT,en.type==='boss'?.22:.045); updHud();
}
function reapDead(byType){
  for(const en of enemies) if(en.hp<=0&&!en.dead){ defeat(en);
    placedOf(byType||'migae').forEach(b=>b.tower.winT=.7); }
}
function rateMul(b){ // 북거씨 인접 버프
  let m=hasteT>0&&b.tower.type==='migae'?.5:1;
  for(const o of blocks){ const t=o.tower; if(!t||t.type!=='bookgeo'||t.lv<1)continue;
    if(Math.abs(o.c-b.c)<=1&&Math.abs(o.r-b.r)<=1&&o!==b)m*=1-TOWERS.bookgeo.lv[t.lv].buff; }
  return m;
}
function barrAt(x,y){
  for(const b of barrs){ const p=center(b.c,b.r);
    if((x-p.x)**2+(y-p.y)**2<=22*22)return b; }
  return null;
}
function update(dt){
  time+=dt;
  if(!SG)return;
  if(gSlowT>0)gSlowT-=dt; if(hasteT>0)hasteT-=dt; if(owwT>0)owwT-=dt;
  if(stunT>0)stunT-=dt; if(shieldT>0)shieldT-=dt; if(crewT>0)crewT-=dt;
  for(const k in skCool)if(skCool[k]>0)skCool[k]-=dt;
  updSkills();
  if(state==='PREP'&&waveIdx>=0){ prepT-=dt; ui.info.textContent=`다음 웨이브까지 ${Math.ceil(prepT)}초 — 재정비!`; if(prepT<=0)startWave(); }
  if(state!=='WAVE'&&state!=='PREP')return;
  // T타일 은행 스폰 — '바람 부는 웨이브'에 유한 버스트
  if(tSpots.length&&state==='WAVE'&&tLeft>0){ tTimer-=dt;
    if(tTimer<=0){ tTimer=6; tLeft--;
      for(const t of tSpots){ spawn('g',t.wp); addFx('text',center(t.c,t.r).x,center(t.c,t.r).y-30,'은행이 우수수!'); } } }
  // 스폰
  for(const s of spawnQ)if(!s.done&&(s.t-=dt)<=0){ s.done=true; spawn(s.type); }
  spawnQ=spawnQ.filter(s=>!s.done);
  // 이동
  for(const en of enemies){
    const E=ENEMIES[en.type];
    // 보스: 소환 + 역주행
    if(en.type==='boss'){ en.sumT-=dt; if(en.sumT<=0){ en.sumT=6; spawn('k',Math.max(0,en.wp-1)); addFx('text',en.x,en.y-60,'꼬릿 소환!'); }
      if(!en.revd&&en.hp<=en.max/2){ en.revd=true; en.rev=3; addFx('text',en.x,en.y-60,'왕꼬릿이 당황했다!'); } }
    const dir=en.rev>0?-1:1; if(en.rev>0)en.rev-=dt;
    const tgt=waypoints[en.wp+dir];
    if(!tgt&&dir>0){ en.dead=true; life--; shakeT=.3; owwT=1.0; SFX.leak(); addFx('bad',en.x,en.y); updHud(); if(life<=0)finish(false); continue; }
    if(!tgt){ en.rev=0; continue; }
    // 바리케이드
    const bar=barrAt(en.x,en.y+((tgt.y>en.y)?14:(tgt.y<en.y)?-14:0)+0*0)||barrAt(en.x+((tgt.x>en.x)?14:(tgt.x<en.x)?-14:0),en.y);
    if(bar&&dir>0){
      if(shieldT<=0)bar.tower.hp-=4*dt;
      en.hp-=TOWERS.boneul.lv[bar.tower.lv].thorn*dt;
      if(bar.tower.hp<=0){ addFx('puff',center(bar.c,bar.r).x,center(bar.c,bar.r).y); barrs.splice(barrs.indexOf(bar),1); updSkills(); }
      if(en.hp<=0&&!en.dead){ defeat(en); placedOf('boneul').forEach(b=>b.tower.winT=.7); }
      continue;
    }
    const aura=auraAt(en.x,en.y); en.slowed=aura.slow<1; en.marked=aura.mark>0;
    const sp=E.spd*TILE*aura.slow*dt;
    const dx=tgt.x-en.x,dy=tgt.y-en.y,d=Math.hypot(dx,dy);
    if(d<=sp){ en.x=tgt.x; en.y=tgt.y; en.wp+=dir; } else { en.x+=dx/d*sp; en.y+=dy/d*sp; }
    en.prog=en.wp+dir*(1-d/TILE);
  }
  // 타워 동작
  for(const b of blocks.concat(barrs)){ const t=b.tower; if(!t)continue;
    if(t.kick>0)t.kick-=dt*6; if(t.winT>0)t.winT-=dt;
    const T=TOWERS[t.type],L=T.lv[t.lv],p=center(b.c,b.r);
    if(t.type==='migae'){
      t.cool-=dt; if(t.cool>0)continue;
      const R2=(L.range*TILE)**2; let best=null;
      for(const en of enemies)if(!en.dead&&(en.x-p.x)**2+(en.y-p.y)**2<=R2&&(!best||en.prog>best.prog))best=en;
      if(best){ t.cool=L.rate*rateMul(b); t.kick=1; SFX.shoot();
        best.hp-=L.dmg*(1+auraAt(best.x,best.y).mark);
        addFx('proj',p.x,p.y-26,null,best);
        if(best.hp<=0&&!best.dead){ defeat(best); t.winT=.7; addFx('heart',p.x,p.y-T.h); } }
    }
    if(t.type==='bookgeo'){
      t.cool-=dt; if(t.cool>0)continue;
      const R2=(L.range*TILE)**2; let hit=false;
      for(const en of enemies)if(!en.dead&&(en.x-p.x)**2+(en.y-p.y)**2<=R2){
        en.hp-=L.dmg*(1+auraAt(en.x,en.y).mark); hit=true;
        if(en.hp<=0&&!en.dead){ defeat(en); t.winT=.7; } }
      if(hit){ t.cool=L.rate*rateMul(b); t.kick=1; SFX.mist(); addFx('ring',p.x,p.y,null,{r:L.range*TILE}); }
    }
    if(t.type==='lachilchin'){
      t.cool-=dt; if(t.cool>0)continue;
      const R2=(L.range*TILE)**2;
      const grab=enemies.find(en=>!en.dead&&(en.type==='g'||(crewT>0&&en.type==='d'))&&(en.x-p.x)**2+(en.y-p.y)**2<=R2);
      if(grab){ t.cool=crewT>0?.3:L.rate; t.kick=1; grab.dead=true; SFX.bell();
        acorns+=L.gain; t.winT=.7;
        addFx('grab',grab.x,grab.y,null,{tx:p.x,ty:p.y}); addFx('text',p.x,p.y-T.h-6,'+'+L.gain); updHud(); }
    }
    if(t.type==='ramda'){
      t.prodT+=dt;
      if(t.prodT>=L.every){ t.prodT=0; acorns+=L.prod; t.kick=1;
        addFx('text',p.x,p.y-T.h-6,'+'+L.prod); updHud(); }
    }
  }
  enemies=enemies.filter(e=>!e.dead);
  if(state==='WAVE'&&!spawnQ.length&&!enemies.length)endWave();
  fx=fx.filter(f=>(f.t-=dt)>0);
  if(shakeT>0)shakeT-=dt;
}
function addFx(kind,x,y,txt,tgt){
  const dur={proj:.12,text:.9,heart:.7,ring:.35,grab:.3,mist:.6,bubble:1.8}[kind]||.45;
  fx.push({kind,x,y,txt,tgt,t:dur,max:dur});
}

// ============ 렌더 ============
const rnd=(c,r,i)=>((c*73+r*137+i*29)%97)/97;
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(shakeT>0)ctx.translate((Math.random()-.5)*6,(Math.random()-.5)*6);
  ctx.clearRect(-10,-10,W+20,H+20);
  ctx.fillStyle='#f3ede2'; ctx.fillRect(0,0,W,H);
  if(!SG)return;
  if(IMGS.bg){ const sc=W/IMGS.bg.width, sh=H/sc, sy=Math.max(0,(IMGS.bg.height-sh)/2);
    ctx.drawImage(IMGS.bg,0,sy,IMGS.bg.width,sh,0,0,W,H);
    ctx.fillStyle='rgba(253,251,245,.60)'; ctx.fillRect(0,0,W,H); }
  ctx.strokeStyle='rgba(90,74,58,.07)'; ctx.lineWidth=1;
  for(let c=0;c<=COLS;c++){ ctx.beginPath(); ctx.moveTo(OX+c*TILE,0); ctx.lineTo(OX+c*TILE,H); ctx.stroke(); }
  for(let r=0;r<=ROWS;r++){ ctx.beginPath(); ctx.moveTo(0,r*TILE); ctx.lineTo(W,r*TILE); ctx.stroke(); }
  for(let r=1;r<=ROWS;r++)for(let c=1;c<=COLS;c++){
    const ch=cellAt(c,r),x=OX+(c-1)*TILE,y=(r-1)*TILE;
    if(ch==='='||ch==='V'){
      ctx.fillStyle='#e4d2a8'; ctx.fillRect(x,y,TILE,TILE);
      ctx.strokeStyle='rgba(90,74,58,.14)'; ctx.strokeRect(x+.5,y+.5,TILE-1,TILE-1);
      ctx.fillStyle='rgba(90,74,58,.12)';
      for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(x+8+rnd(c,r,i)*36,y+8+rnd(c,r,i+3)*36,2+rnd(c,r,i+6)*2,0,7); ctx.fill(); }
    }
  }
  { const x=OX+(entry.c-1)*TILE,y=(entry.r-1)*TILE;
    ctx.fillStyle='#3f5232'; ctx.fillRect(x,y,TILE,TILE);
    ctx.strokeStyle='#222'; ctx.lineWidth=2; ctx.strokeRect(x+1,y+1,TILE-2,TILE-2);
    ctx.strokeStyle='#6f8f56'; ctx.lineWidth=3;
    for(let i=0;i<3;i++){ const bx=x+12+i*14; ctx.beginPath(); ctx.moveTo(bx,y+4); ctx.lineTo(bx,y+TILE-14); ctx.stroke(); }
    ctx.fillStyle='#fdfbf5'; ctx.font='800 9px sans-serif'; ctx.textAlign='center';
    ctx.fillText('대나무숲',x+TILE/2,y+TILE-4); ctx.lineWidth=1; }
  { const x=OX+(villa.c-1)*TILE,y=(villa.r-1)*TILE,cx=x+TILE/2;
    ctx.fillStyle='#f6eed8'; ctx.strokeStyle='#222'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(x+5,y+8,TILE-10,TILE-14,4); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#e8834a'; ctx.beginPath(); ctx.moveTo(x+1,y+10); ctx.lineTo(cx,y-12); ctx.lineTo(x+TILE-1,y+10); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#b06a2a'; ctx.beginPath(); ctx.roundRect(cx-6,y+22,12,16,3); ctx.fill(); ctx.stroke();
    ctx.font='13px sans-serif'; ctx.textAlign='center'; ctx.fillText('🥕',cx-13,y+20);
    ctx.fillStyle='#5a4a3a'; ctx.font='800 8px sans-serif'; ctx.fillText('당근빌라',cx,y+TILE-3); ctx.lineWidth=1; }
  for(const t of tSpots){ const p=center(t.c,t.r);
    ctx.font='38px sans-serif'; ctx.textAlign='center'; ctx.fillText('🌳',p.x,p.y+12);
    if(IMGS.ginkgo)ctx.drawImage(IMGS.ginkgo,p.x+6,p.y+10,14,14); }
  for(const b of blocks){
    const full=TILE-8, s=b.small?{w:full-4,h:22}:{w:full,h:full};
    const x=OX+(b.c-1)*TILE+(TILE-s.w)/2, y=(b.r-1)*TILE+(b.small?TILE-s.h-6:4);
    const hl=!b.tower&&selCard&&canPlace(selCard,b.c,b.r);
    const no=!b.tower&&selCard&&!canPlace(selCard,b.c,b.r);
    ctx.fillStyle=hl?'#cfe3c0':no?'#e4ddd0':'#d9b98a'; ctx.strokeStyle=hl?'#4a7a3a':no?'#b0a48e':'#222';
    ctx.lineWidth=2; ctx.setLineDash(hl?[5,4]:[]);
    ctx.beginPath(); ctx.roundRect(x,y,s.w,s.h,b.small?5:7); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
    if(!hl&&!no&&!b.small){ ctx.strokeStyle='rgba(90,74,58,.25)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x+4,y+s.h/2); ctx.lineTo(x+s.w-4,y+s.h/2); ctx.stroke();
      ctx.fillStyle='rgba(34,34,32,.55)';
      for(const [dx,dy] of [[6,6],[s.w-6,6],[6,s.h-6],[s.w-6,s.h-6]]){ ctx.beginPath(); ctx.arc(x+dx,y+dy,1.6,0,7); ctx.fill(); } }
    ctx.lineWidth=1;
  }
  // 보늘 배치 하이라이트 (경로)
  if(selCard==='boneul')for(let r=1;r<=ROWS;r++)for(let c=1;c<=COLS;c++)
    if(cellAt(c,r)==='='&&!barrs.find(b=>b.c===c&&b.r===r)){
      const x=OX+(c-1)*TILE,y=(r-1)*TILE;
      ctx.strokeStyle='#4a7a3a'; ctx.setLineDash([5,4]); ctx.lineWidth=2;
      ctx.strokeRect(x+4,y+4,TILE-8,TILE-8); ctx.setLineDash([]); ctx.lineWidth=1; }
  if(selTower&&selTower.tower){ const t=selTower.tower,L=TOWERS[t.type].lv[t.lv],p=center(selTower.c,selTower.r);
    if(L.range){ ctx.beginPath(); ctx.arc(p.x,p.y,L.range*TILE,0,7);
      ctx.fillStyle='rgba(210,114,42,.12)'; ctx.fill();
      ctx.strokeStyle='rgba(210,114,42,.6)'; ctx.setLineDash([5,5]); ctx.stroke(); ctx.setLineDash([]); } }
  for(const b of blocks){ const t=b.tower; if(!t||t.type!=='kkito')continue;
    const L=TOWERS.kkito.lv[t.lv],p=center(b.c,b.r),R=L.range*TILE;
    ctx.beginPath(); ctx.arc(p.x,p.y,R,0,7); ctx.fillStyle='rgba(106,120,200,.07)'; ctx.fill();
    const ph=(time%2.2)/2.2;
    ctx.beginPath(); ctx.arc(p.x,p.y,R*ph,0,7);
    ctx.strokeStyle=`rgba(106,120,200,${.45*(1-ph)})`; ctx.lineWidth=2; ctx.stroke(); ctx.lineWidth=1; }
  // 타워
  for(const b of blocks.concat(barrs)){ const t=b.tower; if(!t)continue;
    const T=TOWERS[t.type],p=center(b.c,b.r);
    const frame=owwT>0?IMGS[t.type+'_hit']:(t.winT>0?IMGS[t.type+'_win']:IMGS[t.type]);
    const bob=Math.sin(time*3+b.c)*1.5,kick=Math.max(0,t.kick);
    const scale=1+t.lv*.09,h=T.h*scale*(1-kick*.08),w=frame?h*frame.width/frame.height:h*.8;
    ctx.fillStyle='rgba(90,74,58,.18)'; ctx.beginPath();
    ctx.ellipse(p.x,(b.r)*TILE-5,w*.38,5,0,0,7); ctx.fill();
    if(t.lv===2){ ctx.beginPath(); ctx.arc(p.x,(b.r)*TILE-h/2,h*.62,0,7);
      ctx.strokeStyle=`rgba(224,169,46,${.30+.15*Math.sin(time*4)})`; ctx.lineWidth=2.5; ctx.stroke(); ctx.lineWidth=1; }
    if(frame){ if(t.type==='migae'&&hasteT>0){ ctx.shadowColor='rgba(224,140,40,.8)'; ctx.shadowBlur=10; }
      ctx.drawImage(frame,p.x-w/2,(b.r)*TILE-4-h+bob,w,h); ctx.shadowBlur=0; }
    // 바리케이드 HP
    if(t.type==='boneul'){ const L=TOWERS.boneul.lv[t.lv];
      ctx.fillStyle='#fdfbf5'; ctx.strokeStyle='#222';
      ctx.beginPath(); ctx.roundRect(p.x-20,(b.r)*TILE-4-h-24,40,6,3); ctx.fill(); ctx.stroke();
      ctx.fillStyle=shieldT>0?'#6a9ad8':'#3a8a7a';
      ctx.beginPath(); ctx.roundRect(p.x-19,(b.r)*TILE-3-h-24,38*Math.max(0,t.hp/L.hp),4,2); ctx.fill(); }
    const by=(b.r)*TILE-4-h+bob-15,max=t.lv===2;
    ctx.fillStyle=max?'#f2c14b':'#fdfbf5'; ctx.strokeStyle='#222'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(p.x-16,by,32,14,7); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#5a4a3a'; ctx.font='800 9.5px sans-serif'; ctx.textAlign='center';
    ctx.fillText(max?'MAX':'Lv.'+(t.lv+1),p.x,by+10.5); ctx.lineWidth=1;
  }
  // 골칫거리
  for(const en of enemies){
    const E=ENEMIES[en.type],wob=Math.sin(time*4+en.wob)*2,sq=1+Math.sin(time*6+en.wob)*.04;
    ctx.fillStyle='rgba(90,74,58,.15)'; ctx.beginPath(); ctx.ellipse(en.x,en.y+E.size/2+3,E.size*.35,4,0,0,7); ctx.fill();
    ctx.save(); ctx.translate(en.x,en.y+wob);
    if(en.type==='k'||en.type==='boss'){
      const es=E.size/44; ctx.scale(sq*es,(2-sq)*es);
      ctx.fillStyle=en.type==='boss'?'#9a8cb5':'#aa9ec0'; ctx.strokeStyle='#222'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(-12,4,11,0,7); ctx.arc(-2,-7,14,0,7); ctx.arc(11,2,12,0,7); ctx.arc(0,7,12,0,7); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#c3b8d2'; ctx.beginPath(); ctx.arc(-4,-6,9,0,7); ctx.arc(6,-2,7,0,7); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-4,-4,3.4,0,7); ctx.arc(5,-4,3.4,0,7); ctx.fill();
      ctx.strokeStyle='#222'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.arc(-4,-4,3.4,0,7); ctx.arc(5,-4,3.4,0,7); ctx.stroke();
      ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(-3.4,-3.4,1.5,0,7); ctx.arc(5.6,-3.4,1.5,0,7); ctx.fill();
      ctx.fillStyle='rgba(230,140,150,.5)'; ctx.beginPath(); ctx.arc(-9,1,2.2,0,7); ctx.arc(10,1,2.2,0,7); ctx.fill();
      ctx.strokeStyle='#222'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(-3,3); ctx.quadraticCurveTo(0,5.5,3,3); ctx.stroke();
      const sw=Math.sin(time*5+en.wob)*2;
      ctx.strokeStyle='rgba(138,127,160,.8)';
      ctx.beginPath(); ctx.moveTo(-4+sw,-20); ctx.quadraticCurveTo(sw,-25,-2+sw,-30); ctx.stroke();
      if(en.type==='boss'){ ctx.fillStyle='#f2c14b'; ctx.strokeStyle='#222'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.moveTo(-9,-19); ctx.lineTo(-6,-26); ctx.lineTo(-3,-19); ctx.lineTo(0,-26); ctx.lineTo(3,-19); ctx.lineTo(6,-26); ctx.lineTo(9,-19); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    } else if(en.type==='d'){
      ctx.scale(sq,2-sq);
      ctx.fillStyle='#c9b9a0'; ctx.strokeStyle='#222'; ctx.lineWidth=2;
      ctx.beginPath();
      for(let i=0;i<9;i++){ const a=i/9*6.28,rr=E.size/2+Math.sin(a*3+en.wob)*2;
        i?ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-4,-2,2.6,0,7); ctx.arc(4,-2,2.6,0,7); ctx.fill();
      ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(-3.5,-1.6,1.3,0,7); ctx.arc(4.5,-1.6,1.3,0,7); ctx.fill();
    } else if(en.type==='g'){
      ctx.rotate(time*6%6.28);
      if(IMGS.ginkgo)ctx.drawImage(IMGS.ginkgo,-E.size/2,-E.size/2,E.size,E.size);
      ctx.rotate(-(time*6%6.28));
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-4,-2,2.6,0,7); ctx.arc(4,-2,2.6,0,7); ctx.fill();
      ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(-3.3,-1.6,1.3,0,7); ctx.arc(4.7,-1.6,1.3,0,7); ctx.fill();
    } else if(en.type==='n'){
      ctx.scale(sq,2-sq);
      ctx.strokeStyle='#222'; ctx.lineWidth=2;
      for(const [ox,oy,rr,col] of [[-10,6,14,'#8a6a4a'],[10,6,13,'#a07a50'],[0,-4,16,'#b08a5a']]){
        ctx.fillStyle=col; ctx.beginPath(); ctx.ellipse(ox,oy,rr,rr*.7,0,0,7); ctx.fill(); ctx.stroke(); }
      ctx.fillStyle='#8ab8d8'; ctx.beginPath(); ctx.arc(12,-10,3,0,7); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-4,-4,2.8,0,7); ctx.arc(5,-4,2.8,0,7); ctx.fill();
      ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(-3.4,-3.6,1.4,0,7); ctx.arc(5.6,-3.6,1.4,0,7); ctx.fill();
    }
    ctx.restore();
    if(en.slowed){ ctx.beginPath(); ctx.arc(en.x,en.y,E.size/2+6,0,7);
      ctx.strokeStyle='rgba(106,120,200,.65)'; ctx.setLineDash([4,4]); ctx.lineWidth=1.8; ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth=1; }
    const bw=en.type==='boss'?44:26,bx=en.x-bw/2,by=en.y-E.size/2-13;
    ctx.fillStyle='#fdfbf5'; ctx.strokeStyle='#222'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(bx,by,bw,5,2.5); ctx.fill(); ctx.stroke();
    ctx.fillStyle=en.marked?'#6a78c8':'#d05a4a';
    ctx.beginPath(); ctx.roundRect(bx+1,by+1,(bw-2)*Math.max(0,en.hp/en.max),3,1.5); ctx.fill();
  }
  if(gSlowT>0){ ctx.fillStyle=`rgba(106,120,200,${.10+.05*Math.sin(time*8)})`; ctx.fillRect(0,0,W,H); }
  if(stunT>0){ ctx.fillStyle=`rgba(85,168,148,${.08+.04*Math.sin(time*8)})`; ctx.fillRect(0,0,W,H); }
  for(const f of fx){ const a=f.t/f.max;
    if(f.kind==='proj'&&f.tgt){ const pr=1-a;
      const px=f.x+(f.tgt.x-f.x)*pr,py=f.y+(f.tgt.y-f.y)*pr-Math.sin(pr*Math.PI)*14;
      ctx.fillStyle='#c98a4b'; ctx.strokeStyle='#222'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(px,py,4,0,7); ctx.fill(); ctx.stroke(); ctx.lineWidth=1; }
    if(f.kind==='grab'&&f.tgt){ const pr=1-a;
      const px=f.x+(f.tgt.tx-f.x)*pr,py=f.y+(f.tgt.ty-f.y)*pr-Math.sin(pr*Math.PI)*20;
      if(IMGS.ginkgo)ctx.drawImage(IMGS.ginkgo,px-8,py-8,16,16); }
    if(f.kind==='ring'&&f.tgt){ ctx.globalAlpha=a*.7;
      ctx.beginPath(); ctx.arc(f.x,f.y,f.tgt.r*(1-a*.3),0,7);
      ctx.strokeStyle='#55a894'; ctx.lineWidth=3; ctx.stroke(); ctx.globalAlpha=1; }
    if(f.kind==='mist'){ ctx.globalAlpha=a*.5; ctx.fillStyle='#8ac8e8'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
    if(f.kind==='puff'){ ctx.globalAlpha=a;
      ctx.beginPath(); ctx.arc(f.x,f.y,(1-a)*20,0,7); ctx.strokeStyle='#a8d8b9'; ctx.lineWidth=2.5; ctx.stroke();
      for(let i=0;i<6;i++){ const ang=i/6*6.28+f.t*3,dd=(1-a)*28;
        const px=f.x+Math.cos(ang)*dd,py=f.y+Math.sin(ang)*dd;
        ctx.fillStyle=['#f2c14b','#a8d8b9','#c3b8d2'][i%3];
        ctx.beginPath(); ctx.arc(px,py,3.5*a,0,7); ctx.fill(); }
      ctx.globalAlpha=1; }
    if(f.kind==='pop'){ ctx.globalAlpha=a; ctx.beginPath(); ctx.arc(f.x,f.y,(1-a)*24,0,7);
      ctx.strokeStyle='#e0a92e'; ctx.lineWidth=3; ctx.stroke(); ctx.globalAlpha=1; }
    if(f.kind==='bad'){ ctx.globalAlpha=a*.5; ctx.fillStyle='#d05a4a'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
    if(f.kind==='heart'){ ctx.globalAlpha=a; const hy=f.y-(1-a)*22,hs=5;
      ctx.fillStyle='#e88aa0';
      ctx.beginPath(); ctx.arc(f.x-hs/2,hy,hs/1.6,0,7); ctx.arc(f.x+hs/2,hy,hs/1.6,0,7);
      ctx.moveTo(f.x-hs*1.1,hy+1); ctx.lineTo(f.x,hy+hs*1.5); ctx.lineTo(f.x+hs*1.1,hy+1); ctx.closePath(); ctx.fill();
      ctx.globalAlpha=1; }
    if(f.kind==='text'){ ctx.globalAlpha=a; ctx.fillStyle='#b08a3a'; ctx.font='800 13px sans-serif';
      ctx.textAlign='center'; ctx.fillText(f.txt,f.x,f.y-(1-a)*18); ctx.globalAlpha=1; }
    if(f.kind==='bubble'){ // 말풍선
      ctx.globalAlpha=Math.min(1,a*4);
      ctx.font='700 10.5px sans-serif'; const tw2=ctx.measureText(f.txt).width;
      let bx=Math.max(6,Math.min(W-tw2-22,f.x-tw2/2-8)), by=Math.max(4,f.y-10);
      ctx.fillStyle='rgba(253,251,245,.97)'; ctx.strokeStyle='#222'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.roundRect(bx,by,tw2+16,20,9); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(f.x-4,by+19); ctx.lineTo(f.x,by+27); ctx.lineTo(f.x+5,by+19); ctx.closePath();
      ctx.fill(); ctx.strokeStyle='#222';
      ctx.beginPath(); ctx.moveTo(f.x-4,by+20); ctx.lineTo(f.x,by+27); ctx.lineTo(f.x+5,by+20); ctx.stroke();
      ctx.fillStyle='#5a4a3a'; ctx.textAlign='left'; ctx.fillText(f.txt,bx+8,by+14);
      ctx.textAlign='center'; ctx.globalAlpha=1; ctx.lineWidth=1; }
  }
}

// ============ 루프 ============
let last=0;
function loop(ts){ const raw=Math.min(.05,(ts-last)/1000); last=ts;
  let dt=raw*speed;
  if(hitstopT>0){ hitstopT-=raw; dt=0; } // 히트스톱
  update(dt); draw(); requestAnimationFrame(loop); }
ready.then(()=>{
  if(IMGS.acorn)$('acornIco').src=IMGS.acorn.toDataURL();
  $('startBtn').disabled=false; $('startBtn').textContent='골목 지키러 가기';
  requestAnimationFrame(ts=>{ last=ts; requestAnimationFrame(loop); });
});
